<ion-header>
  <ion-toolbar>
    <ion-title>Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item>
      <ion-label>
        <h2>{{ user()?.name }}</h2>
        <p>{{ user()?.email }}</p>
      </ion-label>
    </ion-item>
    <ion-item>
      <ion-label>Dark Mode</ion-label>
      <ion-toggle
        [checked]="darkMode()"
        (ionChange)="onDarkModeChange($event)"
      ></ion-toggle>
    </ion-item>
    <ion-item button (click)="logout()">
      <ion-label color="danger">Sign Out</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
