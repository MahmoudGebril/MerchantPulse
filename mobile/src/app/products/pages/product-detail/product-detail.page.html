<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/products"></ion-back-button>
    </ion-buttons>
    <ion-title>Product</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if (product()) {
    <div class="detail-content">
      <div class="detail-hero">
        <div class="detail-avatar">{{ product()!.name.charAt(0) }}</div>
        <h1>{{ product()!.name }}</h1>
        <span class="detail-badge">{{ product()!.category }}</span>
      </div>
      <div class="detail-card">
        <div class="detail-row">
          <span class="detail-label">Price</span>
          <span class="detail-value detail-value--primary">{{ product()!.price | currency }}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Stock</span>
          <span class="detail-value">{{ product()!.stockQuantity }}</span>
        </div>
      </div>
      @if (product()!.description) {
        <div class="detail-card">
          <h3>Description</h3>
          <p>{{ product()!.description }}</p>
        </div>
      }
    </div>
  } @else {
    <div class="loading-state">
      <ion-spinner name="crescent"></ion-spinner>
    </div>
  }
</ion-content>
