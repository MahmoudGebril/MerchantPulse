<ion-content class="login-page">
  <div class="login-bg"></div>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo-mark"></div>
        <h1>MerchantPulse</h1>
        <p>Sign in to your dashboard</p>
      </div>
      <form (ngSubmit)="login()" class="login-form">
        <div class="input-group">
          <label>Email</label>
          <ion-input
            type="email"
            [(ngModel)]="email"
            name="email"
            required
            placeholder="admin&#64;merchantpulse.demo"
            fill="outline"
          ></ion-input>
        </div>
        <div class="input-group">
          <label>Password</label>
          <ion-input
            type="password"
            [(ngModel)]="password"
            name="password"
            required
            fill="outline"
          ></ion-input>
        </div>
        @if (error()) {
          <p class="error-message">{{ error() }}</p>
        }
        <ion-button
          expand="block"
          type="submit"
          [disabled]="loading()"
          class="submit-btn"
        >
          @if (loading()) {
            <ion-spinner name="crescent"></ion-spinner>
          } @else {
            Sign In
          }
        </ion-button>
      </form>
    </div>
  </div>
</ion-content>
